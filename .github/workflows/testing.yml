---

name: 🧪 Unit testing

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - 1.x
  push:
    branches:
      - 1.x

env:
  DLOAD_CACHE_DIR: ${{ github.workspace }}/runtime/dload-cache

jobs:
  testing:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    env:
      COMPOSER_ROOT_VERSION: '1.x-dev'
    concurrency:
      cancel-in-progress: true
      group: testing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}-${{ matrix.php-version }}-${{ matrix.dependencies }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        php-version:
          - '8.4'
          - '8.5'
        dependencies:
          # - lowest
          # - locked
          - highest
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: sockets
          ini-values: error_reporting=E_ALL

      - name: 🤖 Validate composer.json and composer.lock
        run: composer validate --ansi --strict

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # A cache entry is immutable, so `run_id` keeps the key missing on every run
      # and `restore-keys` reads back the newest entry.
      - name: 🗄️ Restore the dload version registry
        uses: actions/cache@v6
        with:
          path: runtime/dload-cache
          key: dload-registry-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.php-version }}
          restore-keys: dload-registry-

      - name: 🧪 Run tests
        run: composer test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
